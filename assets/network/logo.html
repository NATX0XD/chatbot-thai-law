<!DOCTYPE html>

     blue is a patch cable's, the cyan a link light's. -->

  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1670BD"/><stop offset="1" stop-color="#083A66"/>
    </radialGradient>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="320" cy="320" r="205" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="3"/>
  <g stroke="#DFF5F9" stroke-width="13" stroke-linecap="round">
    <path d="M320 320 L320 122"/>
    <path d="M320 320 L508 259"/>
    <path d="M320 320 L436 480"/>
    <path d="M320 320 L204 480"/>
    <path d="M320 320 L132 259"/>
  </g>
  <g fill="#5FE3F0">
    <circle cx="320" cy="122" r="40"/>
    <circle cx="508" cy="259" r="40"/>
    <circle cx="436" cy="480" r="40"/>
    <circle cx="204" cy="480" r="40"/>
    <circle cx="132" cy="259" r="40"/>
  </g>
  <rect x="246" y="246" width="148" height="148" rx="38" fill="#FFFFFF"/>
  <g fill="#0B4F8A">
    <circle cx="290" cy="320" r="13"/><circle cx="320" cy="320" r="13"/><circle cx="350" cy="320" r="13"/>
  </g>
</svg>
